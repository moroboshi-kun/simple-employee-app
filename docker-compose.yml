version: '3.8'

services:
  mongo:
    image: mongo:4.4
    container_name: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: express-server
    ports:
      - '3080:3080'
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/employees

volumes:
  mongo-data:

